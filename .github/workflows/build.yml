name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOT: android-actions/setup-android@v3 artik KULLANILMIYOR; icindeki
      # 'sdkmanager tools' cagrisi basarisiz oluyor (tools paketi SDK deposundan
      # kaldirildi). Runner'da cmdline-tools zaten kurulu oldugu icin
      # sdkmanager'i dogrudan cagiriyoruz.
      - name: Install SDK 35 + NDK 27 + CMake (lisanslar dahil)
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          [ -x "$SDKMGR" ] || { echo "sdkmanager bulunamadi"; exit 1; }
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Keystore hazirla (release icin; olmazsa debug yeter)
        env:
          KS_B64: ${{ secrets.COOKIE_KEYSTORE_BASE64 }}
          KS_PWD: ${{ secrets.COOKIE_KEYSTORE_PASSWORD }}
        run: |
          set -uo pipefail
          echo "Java: $(java -version 2>&1 | head -1)"
          command -v keytool || { echo "::error::keytool yok"; exit 1; }
          PWD_USE="${KS_PWD:-cookie-launcher-ci}"
          OK=0
          if [ -n "${KS_B64:-}" ]; then
            if echo "$KS_B64" | base64 -d > key-store.jks 2>/dev/null; then
              echo "Kalici keystore kullaniliyor."; OK=1
            else
              echo "::warning::COOKIE_KEYSTORE_BASE64 cozulemedi."
            fi
          fi
          if [ "$OK" = "0" ]; then
            if keytool -genkeypair -noprompt -keystore key-store.jks -alias Cookie-Key \
                 -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 \
                 -storepass "$PWD_USE" -keypass "$PWD_USE" \
                 -dname "CN=Cookie Launcher, O=Cookie Launcher, C=TR"; then
              echo "Gecici keystore uretildi."; OK=1
            else
              echo "::warning::Gecici keystore uretilemedi; yalnizca debug APK derlenecek."
            fi
          fi
          echo "COOKIE_KEYSTORE_PASSWORD=$PWD_USE" >> "$GITHUB_ENV"
          echo "HAVE_RELEASE_KEY=$OK" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -keystore debug-key.jks -alias Cookie-Debug \
            -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 \
            -storepass Cookie-Debug -keypass Cookie-Debug \
            -dname "CN=Cookie Launcher Debug, O=Cookie Launcher, C=TR" || true

      - name: Build APK (arm64, debug)
        run: ./gradlew :FCL:assembleDebug -Darch=all --no-daemon --stacktrace

      - name: Build APK (arm64, release - keystore varsa)
        if: env.HAVE_RELEASE_KEY == '1'
        run: ./gradlew :FCL:assembleRelease -Darch=all --no-daemon --stacktrace

      - name: APK'lari yukle
        uses: actions/upload-artifact@v4
        with:
          name: cookie-launcher-apk
          path: FCL/build/outputs/apk/**/*.apk
          if-no-files-found: warn
